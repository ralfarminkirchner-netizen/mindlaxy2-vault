name: Expand RAKi public system index

on:
  push:
    branches: [raki-system-index-public]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble, verify and expand
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/index.tar.xz.part-* > /tmp/index.tar.xz
          echo "225e22fff142ea14aba63029412178f37e92466cc62aef4fb9b394e46ea4adeb  /tmp/index.tar.xz" | sha256sum --check -
          rm -rf /tmp/index && mkdir -p /tmp/index
          tar -xJf /tmp/index.tar.xz -C /tmp/index
          SOURCE="$(find /tmp/index -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE"
          rsync -a --delete --exclude='.git/' "$SOURCE"/ ./
      - name: Commit expanded index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: expand public RAKi system index" || exit 0
          git push origin HEAD:"${GITHUB_REF_NAME}"
